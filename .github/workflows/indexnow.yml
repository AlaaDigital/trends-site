name: Instant Indexing
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'functions/**'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit to IndexNow (Fixed - Python)
        env:
          DOMAIN: trends.afdalbot.com
          KEY: 161c2d819a244a699639cc876148b31d
        run: |
          python3 << 'PY'
          import glob, json, os
          domain = os.environ['DOMAIN']
          key = os.environ['KEY']

          urls = []
          for f in glob.glob('*.html'):
              if 'template' in f.lower():
                  continue
              if f.lower() == 'index.html':
                  urls.append(f"https://{domain}/")
              else:
                  urls.append(f"https://{domain}/{f}")

          if not urls:
              urls = [f"https://{domain}/"]

          urls = sorted(set(urls))

          payload = {
              "host": domain,
              "key": key,
              "keyLocation": f"https://{domain}/{key}.txt",
              "urlList": urls[:10000]
          }

          print(f"Submitting {len(urls)} URLs:")
          print(json.dumps(payload, indent=2))

          with open('/tmp/payload.json','w') as out:
              json.dump(payload, out)
          PY

          echo "--- Sending to api.indexnow.org ---"
          curl -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json" -d @/tmp/payload.json -v

          echo "--- Sending to bing ---"
          curl -X POST https://www.bing.com/indexnow -H "Content-Type: application/json" -d @/tmp/payload.json -v

          echo "--- Ping sitemaps ---"
          curl -s "https://www.google.com/ping?sitemap=https://trends.afdalbot.com/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://trends.afdalbot.com/sitemap.xml" || true
